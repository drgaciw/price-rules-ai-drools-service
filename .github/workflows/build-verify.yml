name: Build and test

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Full integration tests need Drools/KIE beans and external services; they currently
      # fail ApplicationContext startup on vanilla ubuntu-latest runners. This job still
      # validates that the project compiles and packages.
      - name: Maven package (skip tests)
        run: mvn -B -DskipTests package
